# Development-only MySQL 8. Do not use this file in production.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: portal
      MYSQL_DATABASE: university_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - university_portal_mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uportal", "-pportal"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  university_portal_mysql:
