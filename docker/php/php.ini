; Production PHP settings. Opcache is for php-fpm only so the queue
; worker and scheduler do not each reserve another cache.
expose_php = Off
memory_limit = 192M
upload_max_filesize = 8M
post_max_size = 8M
cgi.fix_pathinfo = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = disable
